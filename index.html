<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雨安店铺</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: #fff;
            position: relative;
        }
        /* 背景图 */
        .bg-img {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        /* 深色遮罩 */
        .mask-layer {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: -1;
        }
        /* 雪花画布 */
        #snowCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }
        /* 主页面容器 */
        .main-wrap {
            width: 100%;
            height: 100%;
            padding: 4vh 6vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            position: relative;
            z-index: 20;
        }
        /* 顶部头像标题 */
        .head-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInUp 1s ease forwards;
        }
        .avatar-circle {
            width: clamp(130px, 35vw, 180px);
            height: clamp(130px, 35vw, 180px);
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(200, 220, 255, 0.3);
        }
        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .shop-name {
            font-size: clamp(32px, 9vw, 46px);
            color: #63a8ff;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 0 12px #408cff77;
        }
        .shop-en {
            font-size: clamp(14px, 4vw, 18px);
            color: #ff88dd;
            margin-top: 6px;
            letter-spacing: 1px;
        }
        /* 功能按钮卡片 */
        .func-card-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards 0.4s;
        }
        .func-btn {
            width: 100%;
            padding: 22px 26px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.18);
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .func-btn:hover, .func-btn:active {
            background: rgba(255,255,255,0.18);
            transform: scale(0.98);
            border-color: rgba(100, 160, 255, 0.5);
        }
        .func-icon {
            font-size: clamp(22px, 6vw, 30px);
            color: #fff;
        }
        .func-text {
            font-size: clamp(18px, 5vw, 24px);
            font-weight: 500;
        }
        /* 底部版权 */
        .copyright-text {
            font-size: clamp(12px, 3vw, 16px);
            color: #ff99dd;
            text-align: center;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.8s;
        }
        /* ========== 可拖动悬浮音乐播放器样式 ========== */
        .music-float-box {
            position: fixed;
            left: 20px;
            bottom: 22vh;
            width: 140px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 10px;
            z-index: 999;
            border: 1px solid rgba(255,255,255,0.15);
            user-select: none;
            touch-action: none;
        }
        .music-top-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .music-icon-circle {
            width: 32px;
            height: 32px;
            background: rgba(80,140,255,0.3);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 16px;
        }
        .music-time-text {
            font-size: 12px;
            color: #ddd;
        }
        .music-progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        .music-progress-inner {
            height: 100%;
            width: 35%;
            background: #63a8ff;
            border-radius: 2px;
        }
        .music-rotate-play {
            animation: musicRotate 3s linear infinite;
        }
        @keyframes musicRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        /* 入场动画 */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- 背景图 本地bg.jpg -->
    <img class="bg-img" src="bg.jpg" alt="背景">
    <div class="mask-layer"></div>
    <canvas id="snowCanvas"></canvas>

    <!-- 可长按拖动悬浮音乐UI -->
    <div class="music-float-box" id="dragMusicBox">
        <div class="music-top-bar">
            <div class="music-icon-circle" id="musicIcon">💖</div>
            <span class="music-time-text">00:11 / 00:30</span>
        </div>
        <div class="music-progress-bar">
            <div class="music-progress-inner" id="progressBar"></div>
        </div>
    </div>

    <div class="main-wrap">
        <div class="head-box">
            <div class="avatar-circle">
                <!-- 本地头像 avatar.png -->
                <img src="avatar.png" alt="头像">
            </div>
            <h1 class="shop-name">雨安店铺</h1>
            <p class="shop-en">- Make everyone a wholesaler</p>
        </div>

        <!-- 仅保留两个按钮 -->
        <div class="func-card-wrap">
            <div class="func-btn" id="btnJump">
                <span class="func-icon">✈</span>
                <span class="func-text">满月+精养账号</span>
            </div>
            <!-- 问题解决按钮：id 改为 btnHelp，确保跳转逻辑绑定 -->
            <div class="func-btn" id="btnHelp">
                <span class="func-icon">❔</span>
                <span class="func-text">问题解决？</span>
            </div>
        </div>

        <div class="copyright-text">
            © YUANstudio. UI Copyright YuAn | 2026
        </div>
    </div>

    <!-- 本地音乐文件 music.mp3 自动循环 -->
    <audio id="bgAudio" loop preload="auto" src="f5aebc0291123ace3cad360597d67552_1498955708878013646_m.mp3"></audio>

    <script>
        // ====================== 1. 雪花粒子动画 ======================
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let snowList = [];
        class Snow {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                this.radius = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.2 + 0.6;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.opacity = Math.random() * 0.6 + 0.4;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
                ctx.fill();
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > height) this.reset();
            }
        }
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        function initSnow() {
            resizeCanvas();
            snowList = [];
            for(let i = 0; i < 90; i++) snowList.push(new Snow());
        }
        function renderSnow() {
            ctx.clearRect(0,0,width,height);
            snowList.forEach(s=>{s.draw();s.update()});
            requestAnimationFrame(renderSnow);
        }
        window.addEventListener('resize', initSnow);
        initSnow();
        renderSnow();

        // ====================== 2. 页面跳转按钮（满月+精养） ======================
        const jumpBtn = document.getElementById('btnJump');
        const targetUrl = "https://new.818fka.com/shop/yuan"; // 修改为你的网址
        jumpBtn.addEventListener('click', ()=>{
            window.open(targetUrl, '_blank');
        })

        // ====================== 3. 可拖动悬浮音乐播放器 + 自动播放 ======================
        const dragBox = document.getElementById('dragMusicBox');
        const audio = document.getElementById('bgAudio');
        const musicIcon = document.getElementById('musicIcon');
        const progressBar = document.getElementById('progressBar');

        // 拖动变量
        let isDrag = false;
        let offsetX, offsetY;

        // 触摸拖动（手机）
        dragBox.addEventListener('touchstart', (e)=>{
            isDrag = true;
            const touch = e.touches[0];
            offsetX = touch.clientX - dragBox.offsetLeft;
            offsetY = touch.clientY - dragBox.offsetTop;
        })
        document.addEventListener('touchmove', (e)=>{
            if(!isDrag) return;
            e.preventDefault();
            const touch = e.touches[0];
            let x = touch.clientX - offsetX;
            let y = touch.clientY - offsetY;
            // 边界限制，不会拖出屏幕
            x = Math.max(0, Math.min(x, window.innerWidth - dragBox.offsetWidth));
            y = Math.max(0, Math.min(y, window.innerHeight - dragBox.offsetHeight));
            dragBox.style.left = x + 'px';
            dragBox.style.top = y + 'px';
            dragBox.style.bottom = "auto";
        })
        document.addEventListener('touchend', ()=> isDrag = false)

        // 鼠标拖动（电脑端）
        dragBox.addEventListener('mousedown', (e)=>{
            isDrag = true;
            offsetX = e.clientX - dragBox.offsetLeft;
            offsetY = e.clientY - dragBox.offsetTop;
        })
        document.addEventListener('mousemove', (e)=>{
            if(!isDrag) return;
            let x = e.clientX - offsetX;
            let y = e.clientY - offsetY;
            x = Math.max(0, Math.min(x, window.innerWidth - dragBox.offsetWidth));
            y = Math.max(0, Math.min(y, window.innerHeight - dragBox.offsetHeight));
            dragBox.style.left = x + 'px';
            dragBox.style.top = y + 'px';
            dragBox.style.bottom = "auto";
        })
        document.addEventListener('mouseup', ()=> isDrag = false)

        // 点击音乐框切换播放/暂停
        dragBox.addEventListener('click', ()=>{
            if(audio.paused){
                audio.play();
                musicIcon.classList.add('music-rotate-play');
            }else{
                audio.pause();
                musicIcon.classList.remove('music-rotate-play');
            }
        })

        // 进度条实时更新
        audio.addEventListener('timeupdate', ()=>{
            let per = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = per + "%";
        })

        // 页面加载自动播放（兼容浏览器限制）
        window.addEventListener('load', async ()=>{
            try{
                await audio.play();
                musicIcon.classList.add('music-rotate-play');
            }catch(err){
                console.log("浏览器限制自动播放，点击音乐悬浮框即可播放");
            }
        })

        // ====================== 4. 问题解决按钮跳转（修正） ======================
        // 获取按钮（通过 id="btnHelp"）
        const helpBtn = document.getElementById('btnHelp');
        // 绑定点击事件：跳转到 wenti.html（同一目录下）
        // 如果你需要跳转到其他网址，修改下方 href 即可
        helpBtn.addEventListener('click', ()=>{
            // 使用 window.location.href 进行页面跳转
            // 请确保 wenti.html 与当前页面在同一目录下，或使用完整路径
            window.location.href = "wenti.html";
        });
    </script>
</body>
</html>
