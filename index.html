<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="无畏契约在榜赋能打手代练服务 - 极速下单，专业靠谱">
    <meta name="theme-color" content="#0e141e">
    <title>【代练】在榜赋能打手</title>
    <link rel="preload" href="assets/logo.webp" as="image">
    <link rel="preload" href="assets/qq.webp" as="image">
    <link rel="preload" href="assets/taobao.webp" as="image">
    <link rel="preload" href="assets/feedback.webp" as="image">
    <link rel="icon" type="image/webp" href="assets/logo.webp">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0e141e;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 20px 20px 30px;
            color: #fff;
            position: relative;
            overflow-x: hidden;
            opacity: 0;
            animation: bodyFadeIn 0.4s ease-out 0.05s forwards;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        @keyframes bodyFadeIn { from { opacity: 0; } to { opacity: 1; } }
        .bg-decor {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .decor-line {
            position: absolute;
            background: rgba(255, 70, 85, 0.2);
        }
        .line-tl { top: 6%; left: 10%; width: 60px; height: 1px; }
        .line-br { bottom: 20%; right: 10%; width: 1px; height: 120px; }
        .decor-text-vertical {
            position: absolute;
            right: 12px; top: 25%;
            color: rgba(255, 70, 85, 0.15);
            font-size: 10px;
            letter-spacing: 3px;
            writing-mode: vertical-rl;
            font-weight: 500;
            animation: decorFadeInRight 0.9s cubic-bezier(0.23, 1, 0.32, 1) 0.3s both;
        }
        .decor-text-vertical-left {
            position: absolute;
            left: 12px; bottom: 20%;
            color: rgba(255, 70, 85, 0.1);
            font-size: 10px;
            letter-spacing: 2px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            animation: decorFadeInLeft 0.9s cubic-bezier(0.23, 1, 0.32, 1) 0.4s both;
        }
        @keyframes decorFadeInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes decorFadeInLeft {
            from { opacity: 0; transform: rotate(180deg) translateX(20px); }
            to { opacity: 1; transform: rotate(180deg) translateX(0); }
        }
        .bg-ghost-val {
            position: absolute;
            top: 15%; left: -5%;
            font-size: 110px;
            font-weight: 900;
            color: rgba(255, 70, 85, 0.03);
            letter-spacing: 15px;
            transform: rotate(-10deg);
            white-space: nowrap;
            pointer-events: none;
            animation: ghostAppear 1s ease-out 0.2s both;
        }
        @keyframes ghostAppear {
            from { opacity: 0; transform: rotate(-10deg) scale(0.95); }
            to { opacity: 1; transform: rotate(-10deg) scale(1); }
        }
        .main-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            flex: 1;
            z-index: 10;
            padding-bottom: 8px;
        }
        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 160px;
            width: 100%;
        }
        .logo-img {
            max-width: 120px; max-height: 120px;
            width: auto; height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(255, 70, 85, 0.3));
            opacity: 0;
            transform: translateY(-15px) scale(0.9);
            animation: logoSpringIn 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
            margin-bottom: 16px;
        }
        @keyframes logoSpringIn {
            0% { opacity: 0; transform: translateY(-15px) scale(0.9); }
            60% { opacity: 1; transform: translateY(3px) scale(1.02); }
            80% { transform: translateY(-1px) scale(0.99); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .title-main {
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #FF4655 0%, #e63a48 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.8rem;
            opacity: 0;
            transform: translateY(12px);
            animation: titleFadeUp 0.5s ease-out 0.35s forwards;
        }
        .title-sub {
            color: #FF4655;
            letter-spacing: 0.45em;
            font-weight: 500;
            margin-top: -6px;
            font-size: 1rem;
            opacity: 0;
            transform: translateY(8px);
            animation: titleFadeUp 0.45s ease-out 0.45s forwards;
        }
        @keyframes titleFadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-group {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 80px;
        }
        .btn-valo {
            position: relative;
            background-color: #FF4655;
            color: white;
            font-weight: 700;
            border: none;
            width: 100%;
            padding: 14px 0;
            font-size: 1.15rem;
            clip-path: polygon(5% 0, 95% 0, 100% 15%, 100% 98%, 0 98%, 0 15%);
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            box-shadow: 0 6px 18px rgba(255, 70, 85, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 auto;
            line-height: 1.5;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.2s ease,
                        box-shadow 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            transform: translateZ(0);
            backface-visibility: hidden;
            overflow: hidden;
        }
        .btn-valo:active {
            transform: scale(0.95) translateZ(0);
            background-color: #d93a46;
            box-shadow: 0 3px 10px rgba(255, 70, 85, 0.4);
            transition: transform 0.1s ease, background-color 0.08s ease, box-shadow 0.1s ease;
        }
        .btn-valo img.icon-img {
            width: 32px; height: 32px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            object-fit: contain;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-valo:active img.icon-img {
            transform: scale(0.9);
            transition: transform 0.08s ease;
        }
        .btn-valo .icon-xl { width: 56px; height: 56px; }
        .btn-animate-1 {
            opacity: 0;
            transform: translateY(35px) scale(0.92) translateZ(0);
            animation: btnSpringIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.55s forwards;
        }
        .btn-animate-2 {
            opacity: 0;
            transform: translateY(35px) scale(0.92) translateZ(0);
            animation: btnSpringIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.7s forwards;
        }
        .btn-animate-3 {
            opacity: 0;
            transform: translateY(35px) scale(0.92) translateZ(0);
            animation: btnSpringIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.85s forwards;
        }
        @keyframes btnSpringIn {
            0% { opacity: 0; transform: translateY(35px) scale(0.92) translateZ(0); }
            60% { opacity: 1; transform: translateY(-4px) scale(1.01) translateZ(0); }
            80% { transform: translateY(2px) scale(0.99) translateZ(0); }
            100% { opacity: 1; transform: translateY(0) scale(1) translateZ(0); }
        }
        .btn-valo::after {
            content: '';
            position: absolute;
            top: -30%; left: -120%;
            width: 60%; height: 160%;
            background: linear-gradient(105deg,
                    transparent 35%,
                    rgba(255,255,255,0.06) 40%,
                    rgba(255,255,255,0.15) 45%,
                    rgba(255,255,255,0.06) 50%,
                    transparent 55%);
            pointer-events: none;
            z-index: 2;
        }
        .btn-animate-1::after { animation: shimmerSweep 1s ease-out 1.1s both; }
        .btn-animate-2::after { animation: shimmerSweep 1s ease-out 1.3s both; }
        .btn-animate-3::after { animation: shimmerSweep 1s ease-out 1.5s both; }
        @keyframes shimmerSweep {
            from { left: -120%; }
            to { left: 130%; }
        }
        .footer-area {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin-top: 64px;
            gap: 20px;
        }
        /* 招打手按钮 - 显眼金色风格 */
        .btn-animate-4 {
            opacity: 0;
            transform: translateY(35px) scale(0.92) translateZ(0);
            animation: btnSpringIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 1.0s forwards;
        }
        .btn-recruit {
            background: linear-gradient(135deg, #ffd93d 0%, #ffb347 50%, #ff9f43 100%) !important;
            color: #2d1b00 !important;
            font-weight: 800 !important;
            box-shadow: 0 6px 20px rgba(255, 179, 71, 0.4),
                        inset 0 1px 0 rgba(255,255,255,0.3) !important;
            letter-spacing: 4px;
        }
        .btn-recruit:active {
            background: linear-gradient(135deg, #ffb347 0%, #ff9f43 50%, #f57c00 100%) !important;
            box-shadow: 0 3px 12px rgba(255, 159, 67, 0.5) !important;
        }
        .btn-recruit::after {
            content: '' !important;
            position: absolute !important;
            top: -30% !important;
            left: -120% !important;
            width: 60% !important;
            height: 160% !important;
            background: linear-gradient(105deg,
                    transparent 35%,
                    rgba(255,255,255,0.2) 40%,
                    rgba(255,255,255,0.4) 45%,
                    rgba(255,255,255,0.2) 50%,
                    transparent 55%) !important;
            pointer-events: none !important;
            z-index: 2 !important;
            animation: shimmerSweep 2.5s ease-in-out 1.5s infinite !important;
        }
        /* 页脚链接区 */
        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 20px;
            opacity: 0;
            animation: footerLinksFade 0.5s ease-out 1.15s forwards;
        }
        .footer-links a {
            color: #8b8f9a;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .footer-links a:active { color: #FF4655; }
        .footer-links .divider {
            color: #2a3142;
            font-size: 13px;
        }
        /* 分隔线 */
        .footer-divider {
            height: 1px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 70, 85, 0.3) 50%,
                    transparent 100%);
            opacity: 0;
            animation: dividerFade 0.5s ease-out 1.1s forwards;
        }
        @keyframes dividerFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes footerLinksFade { from { opacity: 0; } to { opacity: 1; } }
        /* 版权信息 */
        .footer-copy {
            text-align: center;
            color: #4a5060;
            font-size: 11px;
            line-height: 1.8;
            opacity: 0;
            animation: footerCopyFade 0.5s ease-out 1.2s forwards;
        }
        .footer-copy .brand {
            color: #FF4655;
            font-weight: 600;
        }
        @keyframes footerCopyFade { from { opacity: 0; } to { opacity: 1; } }
        .riot-brand {
            font-size: 10px;
            color: #3a4250;
            letter-spacing: 6px;
            text-align: center;
            opacity: 0;
            animation: riotFadeIn 0.5s ease-out 1.3s forwards;
            margin-top: 4px;
        }
        @keyframes riotFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 380px) {
            .title-main { font-size: 2.2rem; }
            .btn-valo { font-size: 1rem; padding: 12px 0; }
            .btn-valo .icon-xl { width: 44px; height: 44px; }
            .btn-valo img.icon-img { width: 26px; height: 26px; }
            .bg-ghost-val { font-size: 70px; top: 12%; left: -8%; }
            .header-section { margin-top: 120px; }
            .btn-recruit { font-size: 1rem; padding: 12px 0; }
        }
    </style>
</head>
<body>
    <div class="bg-decor" aria-hidden="true">
        <div class="decor-line line-tl"></div>
        <div class="decor-line line-br"></div>
        <div class="decor-text-vertical">VALORANT</div>

    <div class="main-wrap">

        <nav class="btn-group" aria-label="服务入口">

                极速下单
            </a>
            <a href="https://m.tb.cn/h.8QKsopm?tk=Nz5pTXq2Aua" class="btn-valo btn-animate-2" rel="noopener">
                <img src="assets/taobao.webp" alt="淘宝下单" class="icon-img icon-xl" width="56" height="56" loading="lazy">

            </a>
            <a href="https://webnote.cc/%E7%93%A6%E6%89%8B%E4%BB%A3%E7%BB%83%E4%BB%B7%E6%A0%BC%E8%A1%A8" class="btn-valo btn-animate-3" rel="noopener">
                <img src="assets/feedback.webp" alt="订单反馈" class="icon-img" width="32" height="32" loading="lazy">
                订单反馈
            </a>
            <a href="https://qm.qq.com/q/6lbUQX9YZO" class="btn-valo btn-recruit btn-animate-4" rel="noopener">

        </nav>

        <footer class="footer-area">
            <div class="footer-divider"></div>
            <div class="footer-links">
                <a href="https://m.tb.cn/h.8kXKMOr?tk=q1NkTXqBOMV" rel="noopener">闲鱼店铺</a>
                <span class="divider">|</span>
                <a href="https://qm.qq.com/q/6lbUQX9YZO" rel="noopener">联系客服</a>
                <span class="divider">|</span>
                <a href="https://webnote.cc/%E7%93%A6%E6%89%8B%E4%BB%A3%E7%BB%83%E4%BB%B7%E6%A0%BC%E8%A1%A8" rel="noopener">价格表</a>
            </div>
            <div class="footer-copy">
                © 2026 <span class="brand">在榜赋能打手</span> 版权所有<br>
                专注无畏契约代练服务 · 保障双方权益
            </div>
            <div class="riot-brand">—— R I O T ——</div>
        </footer>
    </div>
</body>
</html>
